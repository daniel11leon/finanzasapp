<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>FinanzasApp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinanzasApp">
<style>
:root{--bg:#f3f6f5;--card:#fff;--text:#14201e;--muted:#667673;--line:#e2e9e7;--brand:#0f766e;--on-brand:#fff;--in:#15803d;--out:#c2410c;--warn:#d97706;--danger:#dc2626;--soft:#eef4f2;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0d1413;--card:#151f1d;--text:#e7efed;--muted:#8da09c;--line:#233230;--brand:#2dd4bf;--on-brand:#06201c;--in:#4ade80;--out:#fb923c;--warn:#fbbf24;--danger:#f87171;--soft:#1b2a27;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;min-height:100vh}
.side{width:210px;flex:none;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.logo{font-weight:800;font-size:19px;padding:6px 10px 14px;color:var(--brand);letter-spacing:-.3px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left;width:100%;color:var(--muted);font-weight:600}
.nav .i{font-size:18px;width:22px;text-align:center}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--soft);color:var(--brand)}
main{flex:1;min-width:0;width:100%;max-width:980px;margin:0 auto;padding:16px 18px 110px}
#view{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.top.nomonth .month{visibility:hidden}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px}
.month button:hover{background:var(--soft)}
#monthLabel{min-width:132px;text-align:center;font-weight:700;border-radius:999px;width:auto;padding:0 6px;font-size:15px}
#sync{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);white-space:nowrap;min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis}
#sync.ok{color:var(--in)}#sync.error{color:var(--danger)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--muted)}
.kpi small{color:var(--muted);display:block;font-weight:600}
.kpi b{font-size:22px;letter-spacing:-.4px;display:block;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.in{color:var(--in)}.out{color:var(--out)}.neg{color:var(--danger)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 4px;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--soft)}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--soft)}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.grow small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.amt.gasto{color:var(--out)}.amt.ingreso{color:var(--in)}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.prog i.warn{background:var(--warn)}.prog i.over{background:var(--danger)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.pagado{background:rgba(21,128,61,.14);color:var(--in)}.pill.vencido{background:rgba(220,38,38,.14);color:var(--danger)}.pill.pendiente{background:rgba(217,119,6,.15);color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.tools select,label input,label select{width:100%}
.tools input[type=search]{flex:1;min-width:150px;width:auto}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
input[type=color]{padding:2px;height:42px}
label{display:block;margin-bottom:12px;font-weight:600;font-size:13px;color:var(--muted)}
label input,label select{margin-top:4px;color:var(--text);font-weight:400;font-size:15px}
.hint{margin:-8px 0 12px;font-size:13px;color:var(--muted);min-height:16px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:14px 4px 6px}
.dayhead b{font-size:17px;letter-spacing:-.3px;white-space:nowrap;color:var(--text)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sumbar .card{padding:12px}.sumbar .kpi b{font-size:17px;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.donut .dt1{font-size:3px;fill:var(--muted)}.donut .dt2{font-size:4.4px;font-weight:700;fill:var(--text)}
.legend{flex:1;min-width:150px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{width:100%;height:auto}.bars .axl{font-size:9px;fill:var(--muted)}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:12px}
tfoot td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto}
.bottom{display:none}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(15,118,110,.45);z-index:20}
.modal{position:fixed;inset:0;background:rgba(5,15,13,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:18px;padding:20px;border:1px solid var(--line)}
.sheet h3{margin:0 0 14px;font-size:18px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.btns .left{margin-right:auto}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.seg button.on[data-v=gasto]{color:var(--out)}.seg button.on[data-v=ingreso]{color:var(--in)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111c1a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#toast.show{opacity:1}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.setrow{margin-bottom:6px}
@media (max-width:860px){
  .side{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding:10px 12px 120px}
  .top{gap:8px}
  #monthLabel{min-width:0;font-size:14px;padding:0 4px}
  .month button{width:30px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:15}
  .bottom .nav{flex-direction:column;gap:0;font-size:9.5px;padding:5px 0;text-align:center;justify-content:center;border-radius:8px;flex:1;min-width:0;width:auto}
  .bottom .nav span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bottom .nav .i{font-size:19px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));right:16px}
  #toast{bottom:150px}
}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}.kpi b{font-size:19px}}
</style>
</head>
<body>
<div id="app">
  <aside class="side" id="side"></aside>
  <main>
    <div class="top">
      <div class="month"><button data-a="prevMonth" aria-label="Mes anterior">‹</button><button id="monthLabel" data-a="thisMonth" title="Ir al mes actual"></button><button data-a="nextMonth" aria-label="Mes siguiente">›</button></div>
      <button id="sync" data-a="syncNow">Solo local</button>
    </div>
    <section id="view"></section>
  </main>
  <nav class="bottom" id="bottom"></nav>
  <button class="fab" data-a="addTx" aria-label="Agregar movimiento">+</button>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ================= Constantes y utilidades ================= */
var ENT=['transactions','fixed','budgets','goals','categories','cards'];
var LS_DATA='finanzasapp.data.v1', LS_SET='finanzasapp.settings.v1';
var CURRENCIES={COP:'es-CO',USD:'en-US',EUR:'es-ES',MXN:'es-MX',ARS:'es-AR',PEN:'es-PE',CLP:'es-CL',BRL:'pt-BR'};
var ZERO_DEC=['COP','CLP'];
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var NAV=[['resumen','📊','Resumen'],['movimientos','🧾','Movimientos','Movim.'],['fijos','🔁','Fijos'],['tarjeta','💳','Tarjeta'],['presupuestos','🎯','Presupuestos','Presup.'],['metas','🏁','Metas'],['reportes','📈','Reportes'],['ajustes','⚙️','Ajustes']];
var DEF_CATS=[
 ['gasto','Alimentación','🛒','#16a34a'],['gasto','Restaurantes','🍽️','#f97316'],['gasto','Transporte','🚌','#0ea5e9'],
 ['gasto','Vivienda','🏠','#8b5cf6'],['gasto','Servicios','💡','#eab308'],['gasto','Salud','🩺','#ef4444'],
 ['gasto','Educación','📚','#6366f1'],['gasto','Entretenimiento','🎬','#ec4899'],['gasto','Ropa','👕','#14b8a6'],
 ['gasto','Mascotas','🐾','#a16207'],['gasto','Deudas y tarjetas','💳','#dc2626'],['gasto','Suscripciones','🔁','#0891b2'],
 ['gasto','Regalos','🎁','#d946ef'],['gasto','Otros gastos','📦','#64748b'],
 ['ingreso','Salario','💼','#15803d'],['ingreso','Freelance','💻','#0d9488'],['ingreso','Inversiones','📈','#2563eb'],
 ['ingreso','Ventas','🏷️','#ca8a04'],['ingreso','Otros ingresos','💰','#65a30d']
];
var HAS_GAS=typeof google!=='undefined'&&google.script&&google.script.run;

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function curMonth(){return todayStr().slice(0,7);}
function shiftMonth(m,delta){var p=m.split('-').map(Number),y=p[0],mo=p[1]+delta;while(mo>12){mo-=12;y++;}while(mo<1){mo+=12;y--;}return y+'-'+pad(mo);}
function daysIn(m){var p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function monthLabel(m){var p=m.split('-').map(Number),s=MONTHS[p[1]-1];return s.charAt(0).toUpperCase()+s.slice(1)+' '+p[0];}
function monthShort(m){return MONTHS[Number(m.slice(5))-1].slice(0,3);}
function lastMonths(m,n){var a=[];for(var i=n-1;i>=0;i--)a.push(shiftMonth(m,-i));return a;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function dayLong(d){var p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2200);}

/* ================= Estado ================= */
var settings=loadSettings();
var db=loadDB();
var ui={view:'resumen',month:curMonth(),q:'',ftype:'todos',fcat:'',card:''};
var nf,nfc;
setFormats();

function loadSettings(){
  var s={};try{s=JSON.parse(localStorage.getItem(LS_SET)||'{}');}catch(e){}
  return Object.assign({url:'',token:'',currency:'COP',lastPush:0,lastSync:0},s);
}
function saveSettings(){try{localStorage.setItem(LS_SET,JSON.stringify(settings));}catch(e){}}
function seedCategories(){return DEF_CATS.map(function(c,i){return {id:'cat_'+(c[0]==='gasto'?'g':'i')+i,name:c[1],type:c[0],icon:c[2],color:c[3],updatedAt:1,deleted:0};});}
function loadDB(){
  var d={};try{d=JSON.parse(localStorage.getItem(LS_DATA)||'{}');}catch(e){}
  ENT.forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
  if(!d.categories.length)d.categories=seedCategories();
  return d;
}
function save(){try{localStorage.setItem(LS_DATA,JSON.stringify(db));}catch(e){toast('No se pudo guardar en este navegador');}}
function setFormats(){
  var loc=CURRENCIES[settings.currency]||'es-CO',dec=ZERO_DEC.indexOf(settings.currency)>=0?0:2;
  nf=new Intl.NumberFormat(loc,{style:'currency',currency:settings.currency,minimumFractionDigits:dec,maximumFractionDigits:dec});
  nfc=new Intl.NumberFormat(loc,{notation:'compact',maximumFractionDigits:1});
}
function money(n){return nf.format(Number(n)||0);}
function act(k){return db[k].filter(function(x){return !x.deleted;});}
function put(k,o){
  o.updatedAt=Date.now();o.deleted=o.deleted?1:0;
  var i=db[k].findIndex(function(x){return x.id===o.id;});
  if(i>=0)db[k][i]=o;else db[k].push(o);
  save();scheduleSync();
}
function del(k,id){var o=db[k].find(function(x){return x.id===id;});if(o){o.deleted=1;o.updatedAt=Date.now();save();scheduleSync();}}
function find(k,id){return db[k].find(function(x){return x.id===id&&!x.deleted;});}
function catObj(name){return db.categories.find(function(c){return c.name===name&&!c.deleted;})||db.categories.find(function(c){return c.name===name;});}
function catIcon(n){var c=catObj(n);return c?c.icon:'📦';}
function catColor(n){var c=catObj(n);return c&&/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#64748b';}
function catsOf(type){return act('categories').filter(function(c){return c.type===type;});}

/* ================= Cálculos ================= */
function txIn(m){return act('transactions').filter(function(t){return String(t.date).slice(0,7)===m;});}
function total(list,type){return list.filter(function(t){return t.type===type;}).reduce(function(s,t){return s+Number(t.amount||0);},0);}
function byCategory(list){
  var map={};list.filter(function(t){return t.type==='gasto';}).forEach(function(t){map[t.category]=(map[t.category]||0)+Number(t.amount);});
  return Object.keys(map).map(function(n){return {name:n,v:map[n]};}).sort(function(a,b){return b.v-a.v;});
}
function spentIn(cat,m){return txIn(m).filter(function(t){return t.type==='gasto'&&t.category===cat;}).reduce(function(s,t){return s+Number(t.amount);},0);}
function cmpTx(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.updatedAt||0)-(a.updatedAt||0);}
function fixedTx(f,m){return act('transactions').find(function(t){return t.fixedId===f.id&&String(t.date).slice(0,7)===m;});}
function fixedDate(f,m){return m+'-'+pad(Math.min(Math.max(Number(f.day)||1,1),daysIn(m)));}
function fixedStatus(f,m){if(fixedTx(f,m))return 'pagado';return fixedDate(f,m)<todayStr()?'vencido':'pendiente';}
function payFixed(f,m){
  put('transactions',{id:uid('t'),date:fixedDate(f,m),type:f.type,amount:Number(f.amount),category:f.category,description:f.name,account:f.account||'',fixedId:f.id});
}
function accounts(){
  var seen={},out=[];
  var hid=(settings.hiddenAccts||[]);
  function add(n){n=String(n==null?'':n).trim();if(!n)return;var k=n.toLowerCase();if(seen[k])return;seen[k]=1;if(hid.indexOf(k)>=0&&!isCardName(n))return;out.push(n);}
  act('cards').forEach(function(c){add(c.name);});
  ['Efectivo','Cuenta bancaria','Tarjeta de crédito','Billetera digital'].forEach(add);
  act('transactions').forEach(function(t){add(t.account);});
  act('fixed').forEach(function(t){add(t.account);});
  return out;
}
function lastAccount(){var t=act('transactions').sort(cmpTx)[0];return t&&t.account?t.account:'';}
function pctChange(cur,prev){if(!prev)return null;return Math.round((cur-prev)/prev*100);}

/* ----- Tarjeta de crédito ----- */
function norm(v){return String(v==null?'':v).trim().toLowerCase();}
function isCardName(n){n=norm(n);return !!n&&act('cards').some(function(c){return norm(c.name)===n;});}
function cardMatch(acct){return isCardName(acct)&&(!ui.card||norm(acct)===norm(ui.card));}
function cardTx(m){return txIn(m).filter(function(t){return t.type==='gasto'&&cardMatch(t.account);});}
function cardFixed(){return act('fixed').filter(function(f){return f.active&&f.type==='gasto'&&cardMatch(f.account);});}
function sumAmt(l){return l.reduce(function(s,t){return s+Number(t.amount||0);},0);}

/* ----- Cuenta elegida en el Resumen ----- */
function resAcct(){var v=settings.resumenAcct;return v==null||v===''?'Cuenta bancaria':v;}
function resMatch(acct){var a=resAcct();return a==='__all'||norm(acct)===norm(a);}
function resTx(m){return txIn(m).filter(function(t){return resMatch(t.account);});}
function resOptions(){
  var sel=resAcct(),opts=[['Cuenta bancaria','🏦 Cuenta bancaria']];
  act('cards').forEach(function(c){opts.push([c.name,'💳 '+c.name]);});
  accounts().forEach(function(a){if(norm(a)!=='cuenta bancaria'&&!isCardName(a))opts.push([a,a]);});
  opts.push(['__all','Todas las cuentas']);
  var found=opts.some(function(o){return o[0]==='__all'?sel==='__all':norm(o[0])===norm(sel);});
  if(!found)opts.unshift([sel,sel]);
  return opts.map(function(o){var on=o[0]==='__all'?sel==='__all':norm(o[0])===norm(sel);return '<option value="'+esc(o[0])+'"'+(on?' selected':'')+'>'+esc(o[1])+'</option>';}).join('');
}

/* ================= Gráficos (SVG) ================= */
function donut(items,tot){
  if(!tot)return '<div class="empty">Sin gastos en este mes</div>';
  var cum=0,c='';
  items.forEach(function(it){var p=it.v/tot*100;c+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+it.color+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+(25-cum)+'"></circle>';cum+=p;});
  return '<svg viewBox="0 0 42 42" class="donut"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="6"></circle>'+c+'<text x="21" y="20.5" text-anchor="middle" class="dt1">Gastos</text><text x="21" y="26" text-anchor="middle" class="dt2">'+esc(nfc.format(tot))+'</text></svg>';
}
function bars(months,o){
  o=o||{};var ak=o.a||'inc',bk=o.b||'exp',al=o.al||'Ingresos',bl=o.bl||'Gastos',ac=o.ac||'var(--in)',bc=o.bc||'var(--out)';
  var max=1;months.forEach(function(x){max=Math.max(max,x[ak],x[bk]);});
  var W=340,H=150,pb=20,gw=W/months.length,bw=Math.min(16,gw/3),s='';
  months.forEach(function(x,i){
    var cx=i*gw+gw/2,hi=x[ak]/max*(H-pb-8),he=x[bk]/max*(H-pb-8);
    s+='<rect x="'+(cx-bw-1)+'" y="'+(H-pb-hi)+'" width="'+bw+'" height="'+Math.max(hi,x[ak]?1.5:0)+'" rx="3" fill="'+ac+'"><title>'+esc(monthLabel(x.m)+' · '+al+': '+money(x[ak]))+'</title></rect>';
    s+='<rect x="'+(cx+1)+'" y="'+(H-pb-he)+'" width="'+bw+'" height="'+Math.max(he,x[bk]?1.5:0)+'" rx="3" fill="'+bc+'"><title>'+esc(monthLabel(x.m)+' · '+bl+': '+money(x[bk]))+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" class="axl">'+monthShort(x.m)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="bars">'+s+'</svg><div class="key"><span><i style="background:'+ac+'"></i>'+al+'</span><span><i style="background:'+bc+'"></i>'+bl+'</span></div>';
}
function progress(spent,limit){
  var p=limit>0?spent/limit*100:0,cls=p>=100?'over':p>=80?'warn':'';
  return '<div class="prog"><i class="'+cls+'" style="width:'+Math.min(p,100)+'%"></i></div>';
}

function filteredTx(){
  var q=ui.q.trim().toLowerCase();
  return act('transactions').filter(function(t){
    if(String(t.date).slice(0,7)!==ui.month)return false;
    if(ui.ftype!=='todos'&&t.type!==ui.ftype)return false;
    if(ui.fcat&&t.category!==ui.fcat)return false;
    if(q&&(t.description+' '+t.category+' '+t.account).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(cmpTx);
}
function txSumHtml(){
  var l=filteredTx();if(!l.length)return '';
  var inc=total(l,'ingreso'),exp=total(l,'gasto'),net=inc-exp;
  return '<div class="grid g3 sumbar" style="margin-bottom:8px"><div class="card kpi"><small>Ingresos</small><b class="in">'+money(inc)+'</b></div><div class="card kpi"><small>Gastos</small><b class="out">'+money(exp)+'</b></div><div class="card kpi"><small>Neto</small><b class="'+(net<0?'neg':'')+'">'+money(net)+'</b></div></div><p class="note" style="margin:0 0 10px">'+l.length+(l.length===1?' movimiento':' movimientos')+'</p>';
}
function updateTx(){$('#txList').innerHTML=txListHtml();$('#txSum').innerHTML=txSumHtml();}
function txListHtml(){
  var l=filteredTx();if(!l.length)return emptyCard('No hay movimientos con estos filtros');
  var out='',cur='';
  l.forEach(function(t,i){
    if(t.date!==cur){cur=t.date;var dayT=l.filter(function(x){return x.date===cur;}).reduce(function(s,x){return s+(x.type==='gasto'?-x.amount:x.amount);},0);out+='<div class="dayhead"><span>'+esc(cap(dayLong(cur)))+'</span><b class="'+(dayT<0?'out':dayT>0?'in':'')+'">'+(dayT>0?'+':dayT<0?'−':'')+money(Math.abs(dayT))+'</b></div>';}
    out+=txRow(t);
  });
  return out;
}

function catOptions(type,selected){
  var l=catsOf(type),names=l.map(function(c){return c.name;});
  var opts=l.map(function(c){return '<option value="'+esc(c.name)+'"'+(c.name===selected?' selected':'')+'>'+esc(c.icon+' '+c.name)+'</option>';});
  if(selected&&names.indexOf(selected)<0)opts.unshift('<option value="'+esc(selected)+'" selected>'+esc(selected)+'</option>');

  segType:function(d,el){
    var f=$('#f').elements;f.type.value=d.v;
    Array.prototype.forEach.call(el.parentNode.children,function(b){b.classList.toggle('on',b===el);});
    if(f.category)f.category.innerHTML=catOptions(d.v,'');
  },
  ftype:function(d){ui.ftype=d.v;render();},
  addFixed:function(){openFixed({});},
  editFixed:function(d){var x=find('fixed',d.id);if(x)openFixed(x);},
  delFixed:function(d){if(confirm('¿Eliminar este gasto fijo? Los movimientos ya registrados se conservan.')){del('fixed',d.id);closeModal();render();}},
  payFixed:function(d){var f=find('fixed',d.id);if(f){payFixed(f,ui.month);toast('Registrado: '+f.name);render();}},
  payAll:function(){
    var list=act('fixed').filter(function(f){return f.active&&!fixedTx(f,ui.month);});
    list.forEach(function(f){payFixed(f,ui.month);});toast(list.length+' movimientos registrados');render();
  },
  addBudget:function(){openBudget({});},
  editBudget:function(d){var b=find('budgets',d.id);if(b)openBudget(b);},
  delBudget:function(d){if(confirm('¿Eliminar este presupuesto?')){del('budgets',d.id);closeModal();render();}},
  addGoal:function(){openGoal({});},
  editGoal:function(d){var g=find('goals',d.id);if(g)openGoal(g);},
  delGoal:function(d){if(confirm('¿Eliminar esta meta?')){del('goals',d.id);closeModal();render();}},
  contrib:function(d){var g=find('goals',d.id);if(g)openContrib(g);},
  addCat:function(){openCat({});},
  manageCards:function(){openCards();},
  delCard:function(d){
    var c=find('cards',d.id);if(!c)return;
    if(confirm('¿Eliminar la tarjeta «'+c.name+'»? Sus movimientos se conservan, pero dejarán de contar en la sección Tarjeta.')){del('cards',c.id);toast('Tarjeta eliminada');render();openCards();}
  },
  delAcct:function(d){
    var n=d.name;if(!n)return;
    if(confirm('¿Eliminar la cuenta «'+n+'» de la lista? Sus movimientos se conservan.')){
      var h=settings.hiddenAccts||[];h.push(norm(n));settings.hiddenAccts=h;saveSettings();toast('Cuenta eliminada');render();openCards();}
  },
  restoreAccts:function(){settings.hiddenAccts=[];saveSettings();toast('Cuentas restauradas');render();openCards();},
  cardFilter:function(d){ui.card=d.v||'';render();},
  editCat:function(d){var c=find('categories',d.id);if(c)openCat(c);},
  delCat:function(d){
    var c=find('categories',d.id);if(!c)return;
    var used=act('transactions').some(function(t){return t.category===c.name;})||act('fixed').some(function(t){return t.category===c.name;});
    if(confirm(used?'Esta categoría tiene movimientos. Se conservarán con su nombre, pero ya no podrás elegirla. ¿Eliminar?':'¿Eliminar esta categoría?')){del('categories',d.id);closeModal();render();}
  },
  syncNow:function(){syncNow(true);},
  testConn:async function(){
    try{var r=await api({action:'ping'});toast(r.ok?'Conexión correcta ✓':'Error: '+r.error);}catch(e){toast('No se pudo conectar: '+e.message);}
  },
  exportJson:function(){download('finanzasapp-respaldo-'+todayStr()+'.json',JSON.stringify({app:'FinanzasApp',version:1,exportedAt:new Date().toISOString(),data:db},null,1),'application/json');},
  exportCsv:function(){
    var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
    var rows=['Fecha,Tipo,Monto,Categoría,Descripción,Cuenta'].concat(act('transactions').sort(cmpTx).map(function(t){return [t.date,t.type,t.amount,t.category,t.description,t.account].map(q).join(',');}));
    download('movimientos-'+todayStr()+'.csv','﻿'+rows.join('\n'),'text/csv');
  },
  importJson:function(){$('#file').click();},
  resetLocal:function(){if(confirm('Se borrarán los datos guardados en ESTE dispositivo (no la hoja de Google). ¿Continuar?')){localStorage.removeItem(LS_DATA);settings.lastPush=0;settings.lastSync=0;saveSettings();db=loadDB();render();toast('Datos locales borrados');}}
};
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(el){var fn=actions[el.dataset.a];if(fn){fn(el.dataset,el,e);}return;}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;updateTx();return;}
  var h=$('#amtHint');
  if(h&&t.type==='number'&&(t.name==='amount'||t.name==='limit'||t.name==='amt')){var v=num(t.value);h.textContent=v?'= '+money(v):'';}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='racct'){settings.resumenAcct=t.value;saveSettings();render();return;}
  if(t.name==='accountSel'){var inp=t.form.elements.accountNew;inp.style.display=t.value==='__new'?'block':'none';if(t.value==='__new')inp.focus();return;}
  if(t.id==='fcat'){ui.fcat=t.value;updateTx();return;}
  if(t.dataset&&t.dataset.set){
    settings[t.dataset.set]=t.value.trim();saveSettings();
    if(t.dataset.set==='currency'){setFormats();render();}
    return;
  }
  if(t.id==='file'&&t.files&&t.files[0]){
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result),d=j.data||j,n=0;
        ENT.forEach(function(k){(d[k]||[]).forEach(function(o){if(!o||!o.id)return;o.updatedAt=Date.now();var i=db[k].findIndex(function(x){return x.id===o.id;});if(i>=0)db[k][i]=o;else db[k].push(o);n++;});});
        save();scheduleSync();render();toast(n+' registros importados');
      }catch(err){toast('Archivo no válido');}
    };
    r.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal();});

/* ================= Sincronización con Google Sheets ================= */
var syncing=false,pendingSync=false,syncTimer=null,syncState='local',syncMsg='';
function canSync(){return HAS_GAS||(settings.url&&settings.token);}
function api(payload){
  if(HAS_GAS){
    return new Promise(function(res,rej){
      google.script.run.withSuccessHandler(function(r){try{res(JSON.parse(r));}catch(e){rej(e);}}).withFailureHandler(function(e){rej(new Error(e&&e.message||String(e)));}).apiRun(JSON.stringify(payload));
    });
  }
  if(!settings.url)return Promise.reject(new Error('Falta la URL en Ajustes'));
  return fetch(settings.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},payload,{token:settings.token})),redirect:'follow'}).then(function(r){return r.json();});
}
function scheduleSync(){
  updateSyncBadge();
  if(!canSync())return;
  clearTimeout(syncTimer);syncTimer=setTimeout(function(){syncNow(false);},1500);
}
function mergeRemote(data){
  ENT.forEach(function(k){
    var map={};db[k].forEach(function(o,i){map[o.id]=i;});
    (data[k]||[]).forEach(function(r){
      var i=map[r.id];
      if(i===undefined){db[k].push(r);map[r.id]=db[k].length-1;}
      else if((r.updatedAt||0)>(db[k][i].updatedAt||0))db[k][i]=r;
    });
  });
}
async function syncNow(manual){
  if(!canSync()){if(manual){toast('Configura la conexión en Ajustes');ui.view='ajustes';render();}return;}
  if(syncing){pendingSync=true;return;}
  syncing=true;syncState='syncing';updateSyncBadge();
  var start=Date.now(),changes={};
  ENT.forEach(function(k){changes[k]=db[k].filter(function(x){return (x.updatedAt||0)>settings.lastPush;});});
  try{
    var res=await api({action:'sync',changes:changes});
    if(!res||!res.ok)throw new Error(res&&res.error||'Respuesta inválida');
    mergeRemote(res.data);
    settings.lastPush=start;settings.lastSync=Date.now();saveSettings();save();
    syncState='ok';syncMsg='';if(manual)toast('Sincronizado ✓');
    render();
  }catch(err){syncState='error';syncMsg=err.message||String(err);if(manual)toast('Error al sincronizar: '+syncMsg);}
  finally{syncing=false;updateSyncBadge();if(pendingSync){pendingSync=false;scheduleSync();}}
}
function updateSyncBadge(){
  var b=$('#sync');if(!b)return;
  var txt='Solo local',cls='';
  if(canSync()){
    if(syncState==='syncing'){txt='🔄 Sincronizando…';}
    else if(syncState==='error'){txt='⚠️ Sin sincronizar';cls='error';b.title=syncMsg;}
    else if(settings.lastSync){var d=new Date(settings.lastSync);txt='✓ Sincronizado '+pad(d.getHours())+':'+pad(d.getMinutes());cls='ok';}
    else txt='Pendiente de sincronizar';
  }else txt='Solo local · configurar';
  b.textContent=txt;b.className=cls;
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&canSync()&&Date.now()-settings.lastSync>60000)syncNow(false);});
window.addEventListener('online',function(){if(canSync())syncNow(false);});

/* ================= Inicio ================= */
if('serviceWorker' in navigator&&!HAS_GAS&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){});}
renderNav();
render();
save();
if(canSync())syncNow(false);
})();
